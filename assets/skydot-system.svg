<svg xmlns="http://www.w3.org/2000/svg" width="2296" height="1442" viewBox="0 0 2296 1442" role="img" aria-labelledby="title desc">
  <title id="title">SkyDot · 自托管 Personal Agent 工作台与多 Agent 协作系统架构</title>
  <desc id="desc">五层架构：多端入口、主服务控制面、运行引擎、执行能力与协作、可观测性与工程质量。默认由 Host 或 Docker 执行，Durable 与 Cloudflare 属于可选路径。</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#1e293b"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/></linearGradient>
    <filter id="shadow" x="-3%" y="-7%" width="106%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#64748b" flood-opacity=".12"/></filter>
  </defs>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <rect x="2" y="2" width="2292" height="1438" rx="35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="30" y="22" width="2236" height="120" rx="24" fill="url(#header)"/>
    <text x="77" y="75" font-size="40" fill="#ffffff" font-weight="720" xml:space="preserve">SkyDot  ·  自托管 Personal Agent 工作台与多 Agent 协作系统架构</text>
    <text x="77" y="117" font-size="25" fill="#cbd5e1" font-weight="400" xml:space="preserve">TypeScript  ·  Hono  ·  Pi Agent Runtime  ·  Cloudflare Workers + Durable Objects（可选） ·  MCP  ·  Mem0  ·  OpenTelemetry  ·  Langfuse</text>
    <rect x="31" y="171" width="2234" height="194" rx="23" fill="#eff6ff" stroke="#93c5fd" stroke-width="4"/>
    <text x="69" y="216" font-size="27" fill="#1d4ed8" font-weight="710" xml:space="preserve">01  ·  多端与多渠道触达层（Web / 桌面 / 手机 / IM 统一入口）</text>
    <rect x="69" y="240" width="689" height="103" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <text x="99" y="282" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Web / PWA / 手机端工作台</text>
    <text x="99" y="321" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">skydot.eu.cc  ·  在线演示与移动工作台</text>
    <rect x="803" y="240" width="689" height="103" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <text x="833" y="282" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Electron 桌面端 &amp; 本机设备节点</text>
    <text x="833" y="321" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">一次性配对接入  ·  限定文件读取  ·  授权可撤回</text>
    <rect x="1537" y="240" width="689" height="103" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
    <text x="1567" y="282" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">多渠道 IM 统一触达</text>
    <text x="1567" y="321" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">飞书 / 钉钉 / Telegram / Discord / WhatsApp</text>
    <path d="M1148 369 V405" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M1136 401 H1160 L1148 418 Z" fill="#64748b"/>
    <rect x="31" y="423" width="2234" height="194" rx="23" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="4"/>
    <text x="69" y="468" font-size="27" fill="#6d28d9" font-weight="710" xml:space="preserve">02  ·  主服务控制面（TypeScript  ·  Hono  ·  SQLite  ·  安全与幂等边界）</text>
    <rect x="69" y="492" width="689" height="103" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#shadow)"/>
    <text x="99" y="534" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">身份 / 凭据 / 权限 / 预算中心</text>
    <text x="99" y="573" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">主服务校验身份与授权  ·  按工作区控制访问</text>
    <rect x="803" y="492" width="689" height="103" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#shadow)"/>
    <text x="833" y="534" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">消息路由与幂等校验</text>
    <text x="833" y="573" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">会话队列串行调度  ·  投递回执与重复请求校验</text>
    <rect x="1537" y="492" width="689" height="103" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#shadow)"/>
    <text x="1567" y="534" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">MCP Call Intent 审批与审计</text>
    <text x="1567" y="573" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">绑定用户 / 会话 / 参数  ·  按已批准意图核对调用</text>
    <path d="M1148 621 V657" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M1136 653 H1160 L1148 670 Z" fill="#64748b"/>
    <rect x="31" y="675" width="2234" height="202" rx="23" fill="url(#warm)" stroke="#fdba74" stroke-width="4"/>
    <text x="69" y="720" font-size="27" fill="#c2410c" font-weight="710" xml:space="preserve">03  ·  Agent 执行引擎（Pi Agent Runtime + Host / Docker Runner，可选 Durable 实验路径）</text>
    <rect x="69" y="744" width="689" height="111" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadow)"/>
    <text x="99" y="786" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Host / Docker 执行引擎</text>
    <text x="99" y="825" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">本机或非 root 容器  ·  按工作区挂载文件与工具</text>
    <rect x="803" y="744" width="689" height="111" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadow)"/>
    <text x="833" y="786" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Session 级持久化执行（可选）</text>
    <text x="833" y="825" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">Pi Durable  ·  会话绑定  ·  任务检查点与恢复</text>
    <rect x="1537" y="744" width="689" height="111" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadow)"/>
    <text x="1567" y="786" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Cloudflare 云端运行（实验）</text>
    <text x="1567" y="825" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">SQLite Durable Object + Alarm 唤醒  ·  默认关闭</text>
    <path d="M1148 881 V917" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M1136 913 H1160 L1148 930 Z" fill="#64748b"/>
    <rect x="31" y="935" width="2234" height="245" rx="23" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="4"/>
    <text x="69" y="980" font-size="27" fill="#047857" font-weight="710" xml:space="preserve">04  ·  执行能力、安全护栏、多层记忆与 Multi-Agent 协作层</text>
    <rect x="69" y="1004" width="511" height="149" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)"/>
    <text x="95" y="1046" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Computer Use 桌面控制</text>
    <text x="95" y="1085" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">窗口观察与设备操作串行化</text>
    <text x="95" y="1122" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">只读观察  ·  写操作按策略审批</text>
    <rect x="616" y="1004" width="511" height="149" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)"/>
    <text x="642" y="1046" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Browser Use 浏览器操作</text>
    <text x="642" y="1085" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">页面读取与受限交互</text>
    <text x="642" y="1122" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">目标校验  ·  按会话绑定操作</text>
    <rect x="1163" y="1004" width="511" height="149" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)"/>
    <text x="1189" y="1046" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">多层版本化记忆体系</text>
    <text x="1189" y="1085" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">事实 / 偏好 / 决策 / 经验分层</text>
    <text x="1189" y="1122" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">工作区隔离  ·  记忆来源可追溯</text>
    <rect x="1710" y="1004" width="516" height="149" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)"/>
    <text x="1736" y="1046" font-size="27" fill="#0f172a" font-weight="700" xml:space="preserve">Multi-Agent 群聊协作</text>
    <text x="1736" y="1085" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">群聊 @ 与受控任务交接</text>
    <text x="1736" y="1122" font-size="23" fill="#475569" font-weight="400" xml:space="preserve">调用预算  ·  共享进度与回执</text>
    <path d="M1148 1184 V1216" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M1136 1212 H1160 L1148 1229 Z" fill="#64748b"/>
    <rect x="31" y="1234" width="2234" height="174" rx="23" fill="#f1f5f9" stroke="#94a3b8" stroke-width="4"/>
    <text x="69" y="1277" font-size="27" fill="#334155" font-weight="710" xml:space="preserve">05  ·  全链路可观测、隐私保护与工程质量底座</text>
    <rect x="69" y="1299" width="1058" height="87" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="99" y="1353" font-size="25" fill="#0f172a" font-weight="700" xml:space="preserve">OpenTelemetry + Langfuse：按步追踪模型与工具调用、耗时、Token 用量与失败原因</text>
    <rect x="1167" y="1299" width="1059" height="87" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="1197" y="1353" font-size="25" fill="#0f172a" font-weight="700" xml:space="preserve">Vitest 测试与真实模型验收  ·  工作区权限隔离  ·  敏感工具参数按策略遮蔽</text>
  </g>
</svg>
