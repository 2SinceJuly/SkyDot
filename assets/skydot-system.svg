<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="842" viewBox="0 0 1040 842" role="img" aria-labelledby="title description">
<title id="title">SkyDot 系统架构</title>
<desc id="description">五层结构。Web、桌面及消息渠道接入主服务，由队列和调度器将工作交给执行器。工作区提供记忆、工具和协作边界，底层保存运行记录。Cloudflare 路径为可选实验。</desc>
<rect width="1040" height="842" rx="18" fill="#fafbf9"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="16" y="16" width="1008" height="93" rx="12" fill="#203c34"/>
<text x="40" y="58" font-size="31" fill="#ffffff" font-weight="660">SkyDot 系统架构</text>
<text x="42" y="86" font-size="17" fill="#d1e2d8" font-weight="420">一项委托从哪里进入、在哪里执行、结果存在哪里</text>
<rect x="16" y="126" width="1008" height="126" rx="11" fill="#edf5fc" stroke="#bed8ea"/>
<text x="37" y="158" font-size="16" fill="#315975" font-weight="680">01</text>
<text x="73" y="159" font-size="22" fill="#315975" font-weight="660">接入</text>
<rect x="33" y="173" width="318" height="65" rx="7" fill="#ffffff" stroke="#bed8ea"/>
<text x="47" y="199" font-size="19" fill="#20312d" font-weight="640">Web 与 PWA</text>
<text x="47" y="224" font-size="15.5" fill="#455550" font-weight="420">浏览器与移动工作台</text>
<rect x="360" y="173" width="318" height="65" rx="7" fill="#ffffff" stroke="#bed8ea"/>
<text x="374" y="199" font-size="19" fill="#20312d" font-weight="640">Electron 桌面端</text>
<text x="374" y="224" font-size="15.5" fill="#455550" font-weight="420">通过受限 IPC 调用本机能力</text>
<rect x="687" y="173" width="318" height="65" rx="7" fill="#ffffff" stroke="#bed8ea"/>
<text x="701" y="199" font-size="19" fill="#20312d" font-weight="640">消息渠道</text>
<text x="701" y="224" font-size="15.5" fill="#455550" font-weight="420">飞书、Telegram、Discord 等</text>
<path d="M520 252v11m-4-4 4 4 4-4" fill="none" stroke="#75857f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="268" width="1008" height="126" rx="11" fill="#f3f0fa" stroke="#d8cfea"/>
<text x="37" y="300" font-size="16" fill="#5e4c80" font-weight="680">02</text>
<text x="73" y="301" font-size="22" fill="#5e4c80" font-weight="660">主服务</text>
<rect x="33" y="315" width="318" height="65" rx="7" fill="#ffffff" stroke="#d8cfea"/>
<text x="47" y="341" font-size="19" fill="#20312d" font-weight="640">身份与授权</text>
<text x="47" y="366" font-size="15.5" fill="#455550" font-weight="420">用户、Dot 身份和工作区权限</text>
<rect x="360" y="315" width="318" height="65" rx="7" fill="#ffffff" stroke="#d8cfea"/>
<text x="374" y="341" font-size="19" fill="#20312d" font-weight="640">会话与消息路由</text>
<text x="374" y="366" font-size="15.5" fill="#455550" font-weight="420">Hono API 与 WebSocket 推送</text>
<rect x="687" y="315" width="318" height="65" rx="7" fill="#ffffff" stroke="#d8cfea"/>
<text x="701" y="341" font-size="19" fill="#20312d" font-weight="640">队列与调度</text>
<text x="701" y="366" font-size="15.5" fill="#455550" font-weight="420">会话串行、定时任务与结果投递</text>
<path d="M520 394v11m-4-4 4 4 4-4" fill="none" stroke="#75857f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="16" y="410" width="1008" height="126" rx="11" fill="#fff5e9" stroke="#ead4b7"/>
<text x="37" y="442" font-size="16" fill="#80552b" font-weight="680">03</text>
<text x="73" y="443" font-size="22" fill="#80552b" font-weight="660">执行</text>
<rect x="33" y="457" width="318" height="65" rx="7" fill="#ffffff" stroke="#ead4b7"/>
<text x="47" y="483" font-size="19" fill="#20312d" font-weight="640">Host Runner</text>
<text x="47" y="508" font-size="15.5" fill="#455550" font-weight="420">在宿主机运行 Pi Agent</text>
<rect x="360" y="457" width="318" height="65" rx="7" fill="#ffffff" stroke="#ead4b7"/>
<text x="374" y="483" font-size="19" fill="#20312d" font-weight="640">Docker Runner</text>
<text x="374" y="508" font-size="15.5" fill="#455550" font-weight="420">在非 root 容器中运行 Pi Agent</text>
<rect x="687" y="457" width="318" height="65" rx="7" fill="#ffffff" stroke="#ead4b7"/>
<text x="701" y="483" font-size="19" fill="#20312d" font-weight="640">Cloudflare · 实验</text>
<text x="701" y="508" font-size="15.5" fill="#455550" font-weight="420">独立 Worker 与 Durable Object</text>
<rect x="16" y="552" width="1008" height="126" rx="11" fill="#edf7f1" stroke="#bfdcca"/>
<text x="37" y="584" font-size="16" fill="#365f4a" font-weight="680">04</text>
<text x="73" y="585" font-size="22" fill="#365f4a" font-weight="660">能力与协作</text>
<rect x="33" y="599" width="318" height="65" rx="7" fill="#ffffff" stroke="#bfdcca"/>
<text x="47" y="625" font-size="19" fill="#20312d" font-weight="640">工具与扩展</text>
<text x="47" y="650" font-size="15.5" fill="#455550" font-weight="420">为每个 Dot 配置 Skills、MCP 与插件</text>
<rect x="360" y="599" width="318" height="65" rx="7" fill="#ffffff" stroke="#bfdcca"/>
<text x="374" y="625" font-size="19" fill="#20312d" font-weight="640">工作区记忆</text>
<text x="374" y="650" font-size="15.5" fill="#455550" font-weight="420">跨会话复用偏好、事实与决策</text>
<rect x="687" y="599" width="318" height="65" rx="7" fill="#ffffff" stroke="#bfdcca"/>
<text x="701" y="625" font-size="19" fill="#20312d" font-weight="640">多 Dot 群聊 · 可选</text>
<text x="701" y="650" font-size="15.5" fill="#455550" font-weight="420">点名、受控委派和共享回执</text>
<rect x="16" y="694" width="1008" height="126" rx="11" fill="#f0f3f5" stroke="#cdd6da"/>
<text x="37" y="726" font-size="16" fill="#4a5d67" font-weight="680">05</text>
<text x="73" y="727" font-size="22" fill="#4a5d67" font-weight="660">存储与观测</text>
<rect x="33" y="741" width="318" height="65" rx="7" fill="#ffffff" stroke="#cdd6da"/>
<text x="47" y="767" font-size="19" fill="#20312d" font-weight="640">SQLite</text>
<text x="47" y="792" font-size="15.5" fill="#455550" font-weight="420">账户、权限、调度与运行记录</text>
<rect x="360" y="741" width="318" height="65" rx="7" fill="#ffffff" stroke="#cdd6da"/>
<text x="374" y="767" font-size="19" fill="#20312d" font-weight="640">工作区文件与会话</text>
<text x="374" y="792" font-size="15.5" fill="#455550" font-weight="420">保存产物与 Pi 会话记录</text>
<rect x="687" y="741" width="318" height="65" rx="7" fill="#ffffff" stroke="#cdd6da"/>
<text x="701" y="767" font-size="19" fill="#20312d" font-weight="640">可选追踪</text>
<text x="701" y="792" font-size="15.5" fill="#455550" font-weight="420">OpenTelemetry 与 Langfuse</text>
</g>
</svg>
